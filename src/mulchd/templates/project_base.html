{% extends "base.html" %}
{% block title %}mulchd admin — {{ project.display_name }}{% endblock %}
{% block content %}
<style>
  .project-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .project-breadcrumb-org { font-size: 12px; color: #94a3b8; }
  .project-breadcrumb-sep { color: #cbd5e1; }
  .project-breadcrumb-name { font-size: 16px; font-weight: 600; color: #1e293b; }
  .project-switcher { margin-left: 6px; font-size: 11px; padding: 3px 8px; border: 1px solid #e2e8f0; border-radius: 4px; background: white; color: #64748b; cursor: pointer; }
  .project-tabs { display: flex; gap: 2px; border-bottom: 2px solid #e2e8f0; margin-bottom: 16px; }
  .project-tab { padding: 8px 14px; font-size: 13px; color: #64748b; text-decoration: none; }
  .project-tab.active { font-weight: 600; color: #3b82f6; border-bottom: 2px solid #3b82f6; margin-bottom: -2px; }
</style>

<div class="project-header">
  <span class="project-breadcrumb-org">{{ project.org.slug }}</span>
  <span class="project-breadcrumb-sep">/</span>
  <span class="project-breadcrumb-name">{{ project.slug }}</span>
  <select class="project-switcher" onchange="if (this.value) location.href = '/admin/p/' + this.value + '/{{ tab_path }}'">
    <option value="">Switch project ▾</option>
    {% for p in all_projects %}
    <option value="{{ p.org.slug }}/{{ p.slug }}" {% if p.id == project.id %}selected{% endif %}>{{ p.org.slug }} / {{ p.slug }}</option>
    {% endfor %}
  </select>
</div>

<div class="project-tabs">
  <a href="/admin/p/{{ project.org.slug }}/{{ project.slug }}/" class="project-tab {% if active_tab == 'overview' %}active{% endif %}">Overview</a>
  <a href="/admin/p/{{ project.org.slug }}/{{ project.slug }}/records" class="project-tab {% if active_tab == 'records' %}active{% endif %}">Records</a>
  <a href="/admin/p/{{ project.org.slug }}/{{ project.slug }}/record-activity" class="project-tab {% if active_tab == 'record-activity' %}active{% endif %}">Record activity</a>
  <a href="/admin/p/{{ project.org.slug }}/{{ project.slug }}/quality" class="project-tab {% if active_tab == 'quality' %}active{% endif %}">Quality</a>
</div>

{% block project_content %}{% endblock %}
{% endblock %}
